name: Daily job discovery
on:
  schedule:
    # 10:00 UTC ≈ 6am Eastern (5am during standard time)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and score only; don't send anything to /jobs"
        type: boolean
        default: false
      limit:
        description: "Send only the top N jobs (blank = all)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: "discover-jobs"
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 runs the TypeScript in automation/ directly (type stripping).
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run discover:test
      - run: npm run discover -- ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
        env:
          JOB_INTAKE_URL: ${{ secrets.JOB_INTAKE_URL }}
          JOB_INTAKE_TOKEN: ${{ secrets.JOB_INTAKE_TOKEN }}
      # Closed-posting check (step 1c): before the 11:00 batch, so closed jobs are never promoted or screened.
      # Runs even if discovery failed; it only reads the jobs already in /jobs.
      - run: npm run links:check -- ${{ inputs.dry_run && '--dry-run' || '' }}
        if: ${{ !cancelled() }}
        env:
          JOB_LINK_CHECK_URL: ${{ secrets.JOB_LINK_CHECK_URL }}
          JOB_LINK_CHECK_TOKEN: ${{ secrets.JOB_LINK_CHECK_TOKEN }}
